name: CI

# 最小守門：語法門 + 起 server 冒煙。不依賴 Ollama / 網路 / 顯示卡。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Syntax + smoke
        run: npm test
