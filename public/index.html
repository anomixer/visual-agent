<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI PC Agent — 系統管家</title>
  <meta name="description" content="本地優先、無命令列、具備感知能力的系統管家">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .splash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .splash-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      font-size: 48px;
      margin-bottom: 20px;
      animation: splash-pulse 2s infinite ease-in-out;
    }

    .splash-text {
      font-size: 14px;
      color: #9d9d9d;
      font-family: 'Inter', sans-serif;
    }

    @keyframes splash-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
      }

      50% {
        transform: scale(1.1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="splash-overlay" id="splashOverlay">
    <div class="splash-logo">🤖</div>
    <div class="splash-text" id="splashText">正啟動應用程式中...</div>
  </div>

  <div class="app-shell">

    <!-- ── Title Bar ───────────────────────────────────── -->
    <header class="title-bar">
      <div class="title-bar-left">
        <div class="app-icon">
          <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
            <circle cx="12" cy="12" r="10" stroke="url(#tg)" stroke-width="1.8" />
            <path d="M8 12.5l3 3L16 9" stroke="url(#tg)" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" />
            <defs>
              <linearGradient id="tg" x1="0" y1="0" x2="24" y2="24">
                <stop stop-color="#6366f1" />
                <stop offset="1" stop-color="#a78bfa" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="app-name">AI PC Agent</span>
        <span class="app-author">by anomixer</span>

        <!-- Menu bar -->
        <nav class="menu-bar">
          <span class="menu-item" id="menuFile">檔案</span>
          <span class="menu-item" id="menuView">檢視</span>
          <span class="menu-item" id="menuHelp">說明</span>
        </nav>
      </div>

      <div class="title-bar-center">
        <!-- LLM status pill -->
        <div class="llm-status" id="llmStatus" title="本地 AI 引擎狀態">
          <span class="llm-dot" id="llmDot"></span>
          <span class="llm-label" id="llmLabel">檢查中...</span>
        </div>
      </div>

      <div class="title-bar-right">
        <button class="titlebar-btn" id="btnTheme" title="切換主題">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
          </svg>
        </button>
        <button class="titlebar-btn" id="btnImport" title="匯入任務清單">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <path fill-rule="evenodd"
              d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
              clip-rule="evenodd" />
          </svg>
        </button>
        <button class="titlebar-btn" id="btnExport" title="匯出任務清單">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <path fill-rule="evenodd"
              d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM11.707 5.293a1 1 0 00-1.414 0l-4 4a1 1 0 001.414 1.414L9 8.414V14a1 1 0 102 0V8.414l1.293 1.293a1 1 0 001.414-1.414l-4-4z"
              clip-rule="evenodd" />
          </svg>
        </button>
        <input type="file" id="importFileInput" accept=".json" style="display:none">
      </div>
    </header>

    <!-- ── Main Workspace (3-column) ──────────────────── -->
    <div class="workspace">

      <!-- LEFT: 推薦清單 (sidebar) -->
      <aside class="sidebar" id="sidebar">
        <div class="panel-titlebar">
          <span class="panel-title">💡 推薦清單</span>
          <span class="badge" id="recCount">0</span>
        </div>
        <div class="sidebar-search">
          <input type="text" id="recSearchInput" placeholder="搜尋 SOP..." autocomplete="off">
        </div>
        <div class="sidebar-body" id="recommendListContainer">
          <!-- populated by JS -->
        </div>
      </aside>

      <!-- Resize handle -->
      <div class="resize-handle" id="sidebarResizer"></div>

      <!-- CENTER column: 工作清單 + 日誌 -->
      <div class="center-col">

        <!-- CENTER TOP: 工作清單 -->
        <div class="center-top">
          <div class="panel-titlebar">
            <span class="panel-title">📋 工作清單</span>
            <span class="badge" id="todoCount">0</span>
          </div>
          <div class="todo-body" id="todoListContainer">
            <div class="empty-state" id="todoEmpty">
              <div class="empty-icon">✨</div>
              <p>還沒有任務</p>
              <p class="empty-hint">從右側對話輸入需求，或從推薦清單加入</p>
            </div>
          </div>
        </div>

        <!-- CENTER BOTTOM: 工作日誌 -->
        <div class="center-bottom" id="logPanel">
          <div class="panel-titlebar log-titlebar" id="logToggle">
            <div class="tab-row">
              <span class="tab active">📝 工作日誌</span>
            </div>
            <button class="panel-btn" id="btnToggleLog">收起 ▼</button>
          </div>
          <div class="log-body" id="logBody">
            <div class="log-entries" id="logEntries">
              <div class="log-empty">等待任務執行...</div>
            </div>
          </div>
        </div>

      </div>

      <!-- RIGHT: AI 對話 + 輸入框 -->
      <div class="chat-col">

        <!-- CHAT HISTORY -->
        <div class="chat-history" id="chatHistory">
          <div class="panel-titlebar">
            <span class="panel-title">💬 AI 對話</span>
            <span class="chat-model-badge" id="chatModelBadge" style="display:none;">qwen3.5:0.8b</span>
          </div>
          <div class="chat-messages" id="chatMessages">
          </div>
        </div>

        <!-- INPUT BAR -->
        <div class="chat-input-area">
          <div class="input-toolbar">
            <button class="input-btn" id="btnMic" title="語音輸入">
              <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15">
                <path fill-rule="evenodd"
                  d="M7 4a3 3 0 016 0v4a3 3 0 11-6 0V4zm4 10.93A7.001 7.001 0 0017 8a1 1 0 10-2 0A5 5 0 015 8a1 1 0 00-2 0 7.001 7.001 0 006 6.93V17H6a1 1 0 100 2h8a1 1 0 100-2h-3v-2.07z"
                  clip-rule="evenodd" />
              </svg>
            </button>
            <button class="input-btn" id="btnClearChat" title="清除對話">
              <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15">
                <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
            </button>
            <span class="input-hint">Enter 送出 · Shift+Enter 換行</span>
          </div>
          <div class="input-row">
            <textarea id="chatInput" rows="3" placeholder="告訴我你需要什麼... 例如「幫我移除 Copilot」" autocomplete="off"></textarea>
            <button class="btn-send" id="btnSend" title="送出">
              <svg viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
                <path
                  d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- ── Status Bar ───────────────────────────────────── -->
    <footer class="status-bar">
      <span class="status-left">
        <span class="status-item" id="statusLLM">🔴 AI 未就緒</span>
        <span class="status-sep">│</span>
        <span class="status-item" id="statusTasks">0 個任務</span>
      </span>
      <span class="status-right">
        <span class="status-item">AI PC Agent v1.0</span>
        <span class="status-sep">│</span>
        <span class="status-item" id="btnLang" style="cursor:pointer">繁體中文</span>
      </span>
    </footer>

  </div>

  <!-- Task Detail Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="taskModal">
      <div class="modal-header">
        <h3 id="modalTitle">任務詳情</h3>
        <button class="btn-close" id="btnCloseModal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
